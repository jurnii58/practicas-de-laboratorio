[project]
name = "ordenes-api"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.115", "sqlalchemy>=2.0", "alembic>=1.13", "itsdangerous>=2.1", "pyjwt>=2.10", "pwdlib[argon2]>=0.2"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]  # archivos generados por Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
